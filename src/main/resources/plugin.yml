name: EZRecipe
version: 1.0.5
main: com.kodari.ezrecipe.EzRecipePlugin
api-version: '1.21'
author: Kodari
description: Simple and configurable crafting recipes.
commands:
  setup:
    description: Set up EZRecipe and register its recipes.
    usage: /setup
    permission: ezrecipe.admin
    aliases: [ez-setup]
  status:
    description: Check whether EZRecipe recipes are registered.
    usage: /status
    permission: ezrecipe.admin
    aliases: [ez-status]
  ez-show:
    description: Show all EZRecipe crafting recipes.
    usage: /ez-show
permissions:
  ezrecipe.admin:
    description: Allows using EZRecipe administration commands.
    default: op